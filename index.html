<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Occupancy monitor</title>
<style>
  :root { --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#fafafa; --accent:#c0392b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         color: var(--fg); background: var(--bg); margin: 0; padding: 1rem; line-height: 1.4; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  .controls { display: flex; gap: .4rem; align-items: center; }
  .controls input[type=date], .controls button {
    font: inherit; padding: .35rem .6rem; border: 1px solid var(--line); border-radius: 5px;
    background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #f3f4f6; }
  .summary { background: #fff; border: 1px solid var(--line); border-radius: 6px;
             padding: .75rem 1rem; margin: 1rem 0; font-size: .95rem; }
  .summary .pill { display: inline-block; margin-right: 1.5rem; }
  .summary b { color: var(--accent); }
  .chart-wrap { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  canvas { max-width: 100%; }
  h2 { font-size: 1rem; margin: 2rem 0 .75rem; font-weight: 600; }
  .heatmap-wrap { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1rem; overflow-x: auto; }
  .heatmap { border-collapse: collapse; font-size: .8rem; }
  .heatmap th, .heatmap td { padding: 4px 6px; text-align: center; border: 1px solid #fff; }
  .heatmap th { background: #fafafa; color: var(--muted); font-weight: 500; }
  .heatmap td.lbl { background: #fafafa; color: var(--muted); text-align: right; font-weight: 500; padding-right: 8px; }
  .heatmap td.cell { color: #fff; font-variant-numeric: tabular-nums; cursor: default; min-width: 36px; }
  .heatmap td.empty { background: #f3f4f6; color: #d1d5db; }
  .heatmap-legend { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; font-size: .8rem; color: var(--muted); }
  .heatmap-legend .swatch { display: inline-flex; height: 12px; }
  .heatmap-legend .swatch span { display: block; width: 18px; height: 12px; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 1.5rem; text-align: center; }
  .err { color: var(--accent); }
  @media (max-width: 600px) {
    header { flex-direction: column; align-items: stretch; }
    .controls { justify-content: center; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Occupancy monitor</h1>
  <div class="controls">
    <button id="prev" title="Previous day">←</button>
    <input type="date" id="date">
    <button id="next" title="Next day">→</button>
    <button id="today" title="Today">Today</button>
  </div>
</header>

<div id="summary" class="summary">Loading…</div>
<div class="chart-wrap"><canvas id="chart" height="120"></canvas></div>

<h2>Average occupancy by weekday and hour <small style="font-weight:normal;color:var(--muted)">(across all history)</small></h2>
<div class="heatmap-wrap"><div id="heatmap">Loading…</div></div>

<footer>
  Samples every 10 minutes during opening hours (06:00–22:00 local).
</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CSV_URL = './data/occupancy.csv';
const LOCAL_OFFSET_MIN = 8 * 60;
let rows = [];
let chart = null;

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const header = lines[0].split(',');
  return lines.slice(1).map(line => {
    const fields = line.split(',');
    const r = {};
    header.forEach((h, i) => r[h] = fields[i] ?? '');
    return r;
  });
}

function num(v) { return v === '' || v == null ? null : Number(v); }

function todayLocal() {
  const now = new Date();
  const local = new Date(now.getTime() + (LOCAL_OFFSET_MIN + now.getTimezoneOffset()) * 60_000);
  return local.toISOString().slice(0, 10);
}

function shiftDay(days) {
  const picker = document.getElementById('date');
  const [y, m, d] = picker.value.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  picker.value = dt.toISOString().slice(0, 10);
  render();
}

async function load() {
  try {
    const resp = await fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    rows = parseCSV(await resp.text());
  } catch (e) {
    document.getElementById('summary').innerHTML =
      '<span class="err">Could not load data/occupancy.csv. ' +
      'If this is a fresh deployment, wait for the first scheduled run.</span>';
    return;
  }
  const picker = document.getElementById('date');
  if (!picker.value) picker.value = todayLocal();
  render();
  renderHeatmap();
}

function renderHeatmap() {
  const el = document.getElementById('heatmap');
  // Bucket: sum and count of ice_current by (weekday, hour). weekday: 0=Mon..6=Sun
  const HOURS = [];
  for (let h = 6; h < 22; h++) HOURS.push(h);
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const sum = Array.from({length: 7}, () => Array(HOURS.length).fill(0));
  const cnt = Array.from({length: 7}, () => Array(HOURS.length).fill(0));

  for (const r of rows) {
    const v = num(r.ice_current);
    if (v == null || !r.timestamp_local) continue;
    const m = r.timestamp_local.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):/);
    if (!m) continue;
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    const jsDow = d.getUTCDay();          // 0=Sun..6=Sat
    const dow   = (jsDow + 6) % 7;        // 0=Mon..6=Sun
    const hour  = parseInt(m[4], 10);
    const hi = hour - 6;
    if (hi < 0 || hi >= HOURS.length) continue;
    sum[dow][hi] += v;
    cnt[dow][hi] += 1;
  }

  let maxAvg = 0;
  const avg = sum.map((row, i) => row.map((s, j) => {
    if (!cnt[i][j]) return null;
    const a = s / cnt[i][j];
    if (a > maxAvg) maxAvg = a;
    return a;
  }));

  if (maxAvg === 0) {
    el.innerHTML = '<span style="color:var(--muted)">No history yet — the heatmap will fill in as samples arrive.</span>';
    return;
  }

  const cap = num(rows[rows.length - 1]?.ice_capacity) || maxAvg;
  const colorFor = (a) => {
    // 0 -> light yellow, capacity -> dark red. Use ratio of capacity (not maxAvg) so colors mean "fullness".
    const t = Math.min(1, a / cap);
    const r = Math.round(255 * (0.4 + 0.6 * t));
    const g = Math.round(220 * (1 - t * 0.85));
    const b = Math.round(120 * (1 - t));
    return `rgb(${r},${g},${b})`;
  };

  let html = '<table class="heatmap"><thead><tr><th></th>';
  for (const h of HOURS) html += `<th>${String(h).padStart(2, '0')}</th>`;
  html += '</tr></thead><tbody>';
  for (let i = 0; i < 7; i++) {
    html += `<tr><td class="lbl">${DOW[i]}</td>`;
    for (let j = 0; j < HOURS.length; j++) {
      const a = avg[i][j];
      if (a == null) {
        html += '<td class="cell empty">·</td>';
      } else {
        const n = cnt[i][j];
        html += `<td class="cell" style="background:${colorFor(a)}" title="${DOW[i]} ${HOURS[j]}:00 — mean ${a.toFixed(1)} (n=${n})">${Math.round(a)}</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  html += `<div class="heatmap-legend">empty<span class="swatch">`;
  for (let i = 0; i <= 10; i++) html += `<span style="background:${colorFor((i/10)*cap)}"></span>`;
  html += `</span>full (capacity ${cap})</div>`;
  el.innerHTML = html;
}

function render() {
  const day = document.getElementById('date').value;
  const todays = rows.filter(r => r.timestamp_local && r.timestamp_local.startsWith(day));

  const summary = document.getElementById('summary');
  if (todays.length === 0) {
    summary.textContent = `No samples recorded for ${day}.`;
    if (chart) { chart.destroy(); chart = null; }
    return;
  }

  const labels = todays.map(r => r.timestamp_local.slice(11, 16));
  const ice  = todays.map(r => num(r.ice_current));
  const swim = todays.map(r => num(r.swim_current));
  const gym  = todays.map(r => num(r.gym_current));
  const temperature   = todays.map(r => {
    const c = num(r.temperature_c);
    return c == null ? null : c * 9 / 5 + 32;
  });
  const precipitation = todays.map(r => num(r.precipitation_mm));

  let peakVal = null, peakTime = '—';
  ice.forEach((v, i) => {
    if (v != null && (peakVal == null || v > peakVal)) { peakVal = v; peakTime = labels[i]; }
  });
  const cap = num(todays[todays.length - 1].ice_capacity);
  const dow = new Date(day + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  const failures = todays.filter(r => r.api_status !== 'ok').length;

  summary.innerHTML = `
    <span class="pill"><b>${dow}</b></span>
    <span class="pill">Peak: <b>${peakVal ?? '—'}</b> at ${peakTime}${cap ? ' (capacity ' + cap + ')' : ''}</span>
    <span class="pill">Samples: ${todays.length}${failures ? ' · ' + failures + ' failed' : ''}</span>
  `;

  if (chart) chart.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'line', label: 'Primary', data: ice,
          borderColor: '#e67e22', backgroundColor: '#e67e22',
          yAxisID: 'yPeople', tension: .25, pointRadius: 2 },
        { type: 'line', label: 'Secondary', data: swim,
          borderColor: '#3498db', backgroundColor: '#3498db',
          yAxisID: 'yPeople', tension: .25, pointRadius: 2, hidden: true },
        { type: 'line', label: 'Gym', data: gym,
          borderColor: '#9b59b6', backgroundColor: '#9b59b6',
          yAxisID: 'yPeople', tension: .25, pointRadius: 2, hidden: true },
        { type: 'line', label: 'Temperature (°F)', data: temperature,
          borderColor: '#e74c3c', backgroundColor: '#e74c3c',
          yAxisID: 'yTemp', tension: .25, pointRadius: 0, borderDash: [4, 3] },
        { type: 'bar', label: 'Precipitation (mm)', data: precipitation,
          borderColor: '#2980b9', backgroundColor: 'rgba(41, 128, 185, .35)',
          yAxisID: 'yPrecip' },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom' } },
      scales: {
        x: { title: { display: true, text: 'Time' } },
        yPeople: { type: 'linear', position: 'left',
                   title: { display: true, text: 'People' }, beginAtZero: true },
        yTemp:   { type: 'linear', position: 'right',
                   title: { display: true, text: '°F' },
                   grid: { drawOnChartArea: false } },
        yPrecip: { type: 'linear', position: 'right',
                   beginAtZero: true, display: false,
                   grid: { drawOnChartArea: false } },
      }
    }
  });
  document.getElementById('chart').parentElement.style.height = '440px';
}

document.getElementById('date').addEventListener('change', render);
document.getElementById('prev').onclick = () => shiftDay(-1);
document.getElementById('next').onclick = () => shiftDay(+1);
document.getElementById('today').onclick = () => {
  document.getElementById('date').value = todayLocal();
  render();
};

load();
</script>
</body>
</html>
